[package]
name = "vmt-unlock"
description = "Verify a stage 0 guest's attestation report, then release its disk key"
# Its own version, not the workspace's: a version bump of the snp library or
# the stage 0 agent would change the agent's binary, and so every measurement.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test builds only: lets the end-to-end tests perturb one input to a check
# (see --inject in main.rs). Never enabled in a release build.
fault-injection = []

[dependencies]
snp = { path = "../snp" }
sha2.workspace = true
libc.workspace = true
