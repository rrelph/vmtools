[package]
name = "vmt-unlock"
description = "Verify a stage 0 guest's attestation report, then release its disk key"
# The workspace's version, like every member: one number per release
# (tag vmtools-X.Y.Z). It changes the stage 0 agent's binary too, and so the
# measurement of the next stage 0 built from the release (README, Versions).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test builds only: lets the end-to-end tests perturb one input to a check
# (see --inject in main.rs). Never enabled in a release build.
fault-injection = []

[dependencies]
snp = { path = "../snp" }
sha2.workspace = true
libc.workspace = true
