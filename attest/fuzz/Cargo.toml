# Fuzz targets for the snp crate (cargo-fuzz; needs a nightly toolchain):
#   cargo +nightly fuzz run parse_report -- -max_total_time=300
# Development only. This crate is outside the workspace, with its own
# Cargo.lock, so libfuzzer-sys (which has a build.rs that compiles libFuzzer's
# C++) never enters the graph of anything that ships.
[package]
name = "snp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
snp = { path = "../snp" }

[[bin]]
name = "parse_report"
path = "fuzz_targets/parse_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

# Its own workspace: not a member of attest/'s.
[workspace]
