# Stage 0's initramfs-tools configuration (mkinitramfs -d). Everything the
# image contains is named here, in modules, or in hooks/stage0; build.sh keeps
# the build host's own hooks, conf-hooks and modprobe settings out.

# Only the modules listed in ./modules, plus their dependencies.
MODULES=list
# Whatever the build user's umask: a group-writable directory is refused by
# dhcpcd and sshd alike, and would change the image.
UMASK=0022
BUSYBOX=y
COMPRESS=zstd
COMPRESSLEVEL=19
DEVICE=
NFSROOT=auto
RUNSIZE=10%
# The root filesystem type is known (the installer's LVM layout, ext4), so
# nothing is probed from the build host.
FSTYPE=ext4
